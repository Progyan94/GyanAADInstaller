name: Build & Release Gyan AAD Hub APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Releases page'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure Keystore
        id: setup_keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret keystore..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
            echo "KEYSTORE_FILE=release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYSTORE_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating secure ephemeral build keystore for CI..."
            keytool -genkeypair -v -keystore app/release.jks \
              -alias gyanaadhub \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "gyanaadhub_ci_pass" \
              -keypass "gyanaadhub_ci_pass" \
              -dname "CN=GyanAADHub, OU=GyanXD25, O=GyanXD25, C=US"
            echo "KEYSTORE_FILE=release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=gyanaadhub_ci_pass" >> $GITHUB_ENV
            echo "KEYSTORE_ALIAS=gyanaadhub" >> $GITHUB_ENV
            echo "KEY_PASSWORD=gyanaadhub_ci_pass" >> $GITHUB_ENV
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Capture Build Failure Log
        if: failure()
        run: |
          echo "==== GRADLE ERROR LOG ====" > build_error.txt
          tail -n 150 build.log >> build_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_error.txt
          git commit -m "ci: capture build error log [skip ci]"
          git push origin main

      - name: Verify Output APK & Checksum
        id: verify_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_NAME=$(basename "$APK_PATH")
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          
          echo "=========================================="
          echo "APK Built Successfully: $APK_NAME"
          echo "Path: $APK_PATH"
          echo "Size: $APK_SIZE bytes"
          echo "SHA256: $SHA256"
          echo "=========================================="
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.verify_apk.outputs.apk_name }}
          path: ${{ steps.verify_apk.outputs.apk_path }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Gyan AAD Hub (Latest Release)' }}
          body: |
            ### 🚗 Gyan AAD Hub - Android Auto App Downloader & Safe Installer
            **Copyright (C) 2026 GyanXD25** • Licensed under GNU GPL v3.0  
            *Based on KingInstaller core installation engine.*

            #### 🛡️ Release Details:
            - **Package:** `com.gyanxd25.gyanaadhub`
            - **Binary:** `${{ steps.verify_apk.outputs.apk_name }}`
            - **SHA256 Checksum:** `${{ steps.verify_apk.outputs.apk_sha256 }}`

            #### ⚠️ Road Safety Notice:
            *Media streaming and screen mirroring features are strictly intended for parked vehicles or passengers. Comply with all applicable traffic safety laws.*

            #### 📲 Download & Installation:
            Download the verified `.apk` below and install directly on your Android phone.
          files: ${{ steps.verify_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
