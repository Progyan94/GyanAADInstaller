plugins {
    alias libs.plugins.android.application
    alias libs.plugins.jetbrains.kotlin.android
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("signing.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signStorePassword = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['STORE_PASSWORD']
def signKeyAlias = System.getenv("KEYSTORE_ALIAS") ?: keystoreProperties['KEYSTORE_ALIAS']
def signKeyPassword = System.getenv("KEY_PASSWORD") ?: keystoreProperties['KEY_PASSWORD']
def signKeystorePath = System.getenv("KEYSTORE_FILE")
def signKeystoreFile = signKeystorePath ? file(signKeystorePath) : (file("keysing.jks").exists() ? file("keysing.jks") : null)

android {
    compileSdk = 37

    defaultConfig {
        applicationId "com.gyanxd25.gyanaadhub"
        minSdk 26
        targetSdk 37
        versionCode 9
        versionName "2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        aidl true
    }

    signingConfigs {
        release {
            if (signKeystoreFile != null && signKeystoreFile.exists() && signStorePassword) {
                storeFile signKeystoreFile
                storePassword signStorePassword
                keyAlias signKeyAlias
                keyPassword signKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.example.kinginstaller'

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "GyanAADHub-v${variant.versionName}.apk"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.hiddenapibypass

    def shizuku_version = '13.1.5'
    implementation libs.api
    implementation libs.provider

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}